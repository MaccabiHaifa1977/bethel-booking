<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bethel Hostel – Demo Booking System</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f3ece1;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { color: #2c2217; margin-top: 0; }
        .banner {
            background: #ff9800;
            color: #000;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p { color: #666; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 32px;
            background: #8a4b24;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        a:hover { background: #6a3918; }
        .info { font-size: 14px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">🚀 DEMO SITE – No real payments</div>
        <h1>Bethel Hostel</h1>
        <p>Try our new booking system. This is a test environment.</p>
        <a href="https://bethel-booking-production.up.railway.app/" id="redirect-link">Enter Demo →</a>
        <div class="info">Redirecting in 3 seconds...</div>
    </div>
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function() {
            window.location.href = 'https://bethel-booking-production.up.railway.app/';
        }, 3000);
    </script>
</body>
</html>
